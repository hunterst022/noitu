<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Điều khiển Nối Từ</title>
<style>
body{font-family:"Segoe UI",Arial,sans-serif;background:#0f172a;color:#e2e8f0;max-width:560px;margin:0 auto;padding:20px}
h1{font-size:22px;margin-bottom:14px} h2{font-size:17px;margin-bottom:10px}
.card{background:#1e293b;border-radius:14px;padding:16px;margin-bottom:14px}
button{padding:11px 16px;border:0;border-radius:10px;font-weight:700;font-size:15px;cursor:pointer;margin:4px 6px 4px 0;background:#6366f1;color:#fff}
button.r{background:#ef4444} button.g{background:#0891b2} button.off{background:#475569} button.sm{padding:7px 11px;font-size:13px;margin:0}
input[type=text]{padding:10px;border-radius:8px;border:1px solid #475569;background:#0f172a;color:#fff;margin:4px 6px 4px 0;width:46%}
.big{font-size:34px;font-weight:900;color:#67e8f9} small{color:#94a3b8}
.vol{display:flex;align-items:center;gap:12px;margin:10px 0} .vol input{flex:1;accent-color:#8b5cf6} .vol b{width:48px;text-align:right}
.trk{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:10px;background:#0f172a;margin:6px 0;border:2px solid transparent}
.trk.on{border-color:#22d3ee;background:#082f49} .trk .n{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.up{display:block;border:2px dashed #475569;border-radius:12px;padding:14px;text-align:center;margin-top:10px;cursor:pointer;color:#94a3b8}
.up.drag{border-color:#22d3ee;color:#fff}
</style></head><body>
<h1>🎮 Điều khiển Nối Từ</h1>
<div class="card">Cần nối từ: <span class="big" id="need">…</span><br><small id="info"></small></div>
<div class="card">
  <button class="g" onclick="api('skip')">⏭ Bỏ qua (hệ thống nối)</button>
  <button class="r" onclick="if(confirm('Bắt đầu ván mới?'))api('reset')">🔄 Ván mới</button>
  <button class="r" onclick="if(confirm('Xoá toàn bộ bảng vàng?'))api('clear-board')">🗑 Xoá bảng vàng</button>
</div>

<div class="card">
  <h2>🎵 Nhạc nền</h2>
  <button id="mt" onclick="toggleMusic()">🔊 Đang bật</button>
  <div class="vol"><span>🔈</span><input id="mv" type="range" min="0" max="100" value="22" oninput="volLabel()" onchange="setVol()"><b id="ml">22%</b></div>
  <div id="tracks"></div>
  <div style="margin-top:10px"><b>▶ Phát từ YouTube</b><br>
    <input type="text" id="yt" placeholder="Dán link video hoặc playlist YouTube" style="width:62%">
    <button onclick="addYT()">➕ Thêm &amp; phát</button></div>
  <div id="yterr" style="color:#fca5a5;font-size:14px;margin-top:6px"></div>
  <label class="up" id="drop">⬆ Bấm hoặc kéo thả file nhạc vào đây (mp3, ogg, wav, m4a – tối đa 30MB)
    <input id="file" type="file" accept=".mp3,.ogg,.wav,.m4a,audio/*" multiple hidden></label>
  <div><small id="upmsg"></small></div>
  <small>Nhạc phát ở trang overlay (cửa sổ Chrome đang chụp vào live), trang này chỉ điều khiển.</small>
</div>

<div class="card"><b>Thử bình luận giả</b><br>
  <input type="text" id="u" placeholder="Tên người chơi" value="Tester"><input type="text" id="t" placeholder="vd: từ điển">
  <button onclick="send()">Gửi</button><div><small id="res"></small></div>
</div>
<script>
const $=(i)=>document.getElementById(i);
const K=new URLSearchParams(location.search).get('key')||'';
const q=(x)=>x+(x.includes('?')?'&':'?')+'key='+encodeURIComponent(K);
const esc=(s)=>String(s).replace(/[&<>"]/g,(m)=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));
async function api(p){await fetch(q('/api/'+p));load()}
async function send(){const r=await fetch(q('/api/test?user='+encodeURIComponent($('u').value)+'&text='+encodeURIComponent($('t').value)));const j=await r.json();$('res').textContent='Từ cần nối: '+j.need;$('t').value='';load()}
async function load(){const s=await (await fetch('/api/state')).json();$('need').textContent=s.need;$('info').textContent=s.stats.turns+' lượt · '+s.stats.players+' người chơi · trạng thái: '+s.tiktok}

/* ---- nhạc ---- */
let MU={enabled:true,volume:.22,track:'lofi',files:[]}, dragging=false;
async function mset(params){const r=await fetch(q('/api/music/set?'+params));MU=await r.json();drawMusic()}
function toggleMusic(){mset('enabled='+(MU.enabled?0:1))}
function volLabel(){$('ml').textContent=$('mv').value+'%'}
function setVol(){mset('volume='+($('mv').value/100))}
function pickTrack(t){mset('track='+encodeURIComponent(t)+'&enabled=1')}
async function delTrack(n){if(!confirm('Xoá bài "'+n+'"?'))return;const r=await fetch(q('/api/music/delete?name='+encodeURIComponent(n)));MU=await r.json();drawMusic()}
async function addYT(){
  const v=$('yt').value.trim(); if(!v)return; $('yterr').textContent='Đang thêm…';
  const r=await fetch(q('/api/music/addlink?url='+encodeURIComponent(v))); const j=await r.json();
  if(!r.ok){$('yterr').textContent='❌ '+(j.error||'lỗi');return}
  $('yt').value='';$('yterr').textContent='';MU=j;drawMusic();
}
async function delLink(k){if(!confirm('Xoá link này khỏi danh sách?'))return;MU=await (await fetch(q('/api/music/dellink?key='+encodeURIComponent(k)))).json();drawMusic()}
function drawMusic(){
  const mt=$('mt');mt.textContent=MU.enabled?'🔊 Đang bật – bấm để tắt':'🔇 Đang tắt – bấm để bật';mt.className=MU.enabled?'':'off';
  if(!dragging){$('mv').value=Math.round(MU.volume*100);volLabel()}
  const row=(key,label,extra='')=>`<div class="trk ${MU.track===key&&MU.enabled?'on':''}"><span class="n">${label}</span>${MU.track===key&&MU.enabled?'<small>▶ đang phát</small>':`<button class="sm g" data-t="${esc(key)}">▶ Phát</button>`}${extra}</div>`;
  let h=row('lofi','🎹 Nhạc lo-fi mặc định (tự tạo)');
  if(MU.files.length) h+=row('__all__','🔁 Phát tất cả bài đã tải lên');
  for(const l of (MU.links||[])) h+=row(l.key,(l.list?'📺 Playlist: ':'📺 ')+esc(l.title),`<button class="sm r" data-l="${esc(l.key)}">🗑</button>`);
  for(const f of MU.files) h+=row(f,'🎵 '+esc(f),`<button class="sm r" data-d="${esc(f)}">🗑</button>`);
  if(MU.error)$('yterr').textContent='⚠ '+MU.error;
  $('tracks').innerHTML=h;
  $('tracks').querySelectorAll('[data-t]').forEach(b=>b.onclick=()=>pickTrack(b.dataset.t));
  $('tracks').querySelectorAll('[data-l]').forEach(b=>b.onclick=()=>delLink(b.dataset.l));
  $('tracks').querySelectorAll('[data-d]').forEach(b=>b.onclick=()=>delTrack(b.dataset.d));
}
async function loadMusic(){try{MU=await (await fetch(q('/api/music'))).json();drawMusic()}catch(_){}}
$('mv').addEventListener('pointerdown',()=>dragging=true);addEventListener('pointerup',()=>dragging=false);
async function upload(files){
  for(const f of files){
    $('upmsg').textContent='Đang tải lên '+f.name+'…';
    try{const r=await fetch(q('/api/music/upload?name='+encodeURIComponent(f.name)),{method:'POST',body:f});const j=await r.json();
      if(!r.ok){$('upmsg').textContent='❌ '+f.name+': '+(j.error||'lỗi');continue}
      $('upmsg').textContent='✅ Đã thêm '+j.name}catch(e){$('upmsg').textContent='❌ Lỗi mạng khi tải '+f.name}
  }
  loadMusic();
}
$('file').onchange=(e)=>{upload([...e.target.files]);e.target.value=''};
const dz=$('drop');
['dragenter','dragover'].forEach(ev=>dz.addEventListener(ev,(e)=>{e.preventDefault();dz.classList.add('drag')}));
['dragleave','drop'].forEach(ev=>dz.addEventListener(ev,(e)=>{e.preventDefault();dz.classList.remove('drag')}));
dz.addEventListener('drop',(e)=>upload([...e.dataTransfer.files]));

load();loadMusic();setInterval(load,3000);setInterval(loadMusic,4000);
$('yt').addEventListener('keydown',e=>e.key==='Enter'&&addYT());
$('t').addEventListener('keydown',e=>e.key==='Enter'&&send());
</script></body></html>
